name: Compile and run patterns

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Code_CI:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: ["ubuntu:latest"]
        cxx: [g++, clang++]
        cmake_build_type: [Release, Debug]
        kokkos_backend: [SERIAL, OPENMP]
        stdcxx: [20]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/kokkos/ci-containers/${{ matrix.distro }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure code
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
          CMAKE_BUILD_TYPE: ${{ matrix.cmake_build_type }}
          CMAKE_CXX_STANDARD: ${{ matrix.stdcxx }}
          KOKKOS_BACKEND: ${{ matrix.kokkos_backend }}
          CMAKE_EXTRA_OPTS: ${{ matrix.cxx == 'clang++' && '-DCMAKE_CXX_CLANG_TIDY=clang-tidy;-warnings-as-errors=*' || '' }}
        run: |
          cmake_args=(
            -S .
            -B builddir
            "-DKokkos_ENABLE_${KOKKOS_BACKEND}=ON"
            -DKokkos_ENABLE_COMPILER_WARNINGS=ON
            -DCMAKE_CXX_FLAGS=-Werror
            "-DCMAKE_CXX_STANDARD=${CMAKE_CXX_STANDARD}"
            "-DCMAKE_CXX_COMPILER=${CXX}"
            "-DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}"
          )

          if [[ -n "${CMAKE_EXTRA_OPTS}" ]]; then
            cmake_args+=("${CMAKE_EXTRA_OPTS}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build builddir --parallel

      - name: Tests
        run: ctest --test-dir builddir --output-on-failure
