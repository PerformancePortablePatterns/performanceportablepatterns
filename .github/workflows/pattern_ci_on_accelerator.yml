name: Pattern CI on accelerator

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger accelerator builds
        uses: appleboy/gitlab-ci-action@v1.3.0
        id: trigger
        with:
          host: 'https://gitlab.spack.io'
          project_id: '115'
          wait: true
          interval: 60s
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITLAB_TRIGGER_TOKEN }}

      - name: print output
        run: |
          echo ${{ steps.trigger.outputs.id }}
          echo ${{ steps.trigger.outputs.sha }}
          echo ${{ steps.trigger.outputs.web_url }}
          echo ${{ steps.trigger.outputs.status }}
