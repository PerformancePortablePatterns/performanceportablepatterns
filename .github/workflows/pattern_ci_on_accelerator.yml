name: Pattern CI on accelerator
# Why do we have to do all this and not just use Webhooks: Gitlabs interface regexes one .git away in the url. since that is part of this repostitory name it will just lead to a non-existing url and I have not found a workaround

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Code_CI:
    name: Trigger and monitor Gitlab CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code in the github runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures all history/branches are pulled

      - name: Push branch to GitLab
        run: |
          git push --force-with-lease "https://oauth2:${{ secrets.GITLAB_SYNC_TOKEN }}@gitlab.spack.io/jbludau/performanceportablepatterns.github.io.git" HEAD:${{ github.head_ref }}

      - name: Wait for GitLab to register the reference
        run: sleep 5

      - name: Trigger accelerator builds
        uses: digital-blueprint/gitlab-pipeline-trigger-action@v1
        with:
          host: 'gitlab.spack.io'
          id: ${{ secrets.GITLAB_PROJECT_ID }}
          ref: ${{ github.head_ref }}
          trigger_token: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          access_token: ${{ secrets.GITLAB_SYNC_TOKEN}}

          # Polling & Artifact behavior
          download_job_logs: 'true'  # Downloads raw console output text files for all jobs
          download_path: './gitlab-outputs' # The local directory on the GitHub runner to save files to
          verbose: 'true'

      - name: Upload accelerator build logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-job-logs
          path: ./gitlab-outputs/*
