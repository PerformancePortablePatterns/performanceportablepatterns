name: Patterns CI on CPU

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Code_CI:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: ["ubuntu:latest"]
        cxx: [g++, clang++]
        cmake_build_type: [Release]
        kokkos_backend: [SERIAL, OPENMP]
        stdcxx: [20]
        include:
          - cxx: "clang++"
            clang_tidy_args: 'clang-tidy;-warnings-as-errors=*'
            sanitizer_flags: '-fsanitize=address,undefined,leak'

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/kokkos/ci-containers/${{ matrix.distro }}
    steps:
      - name: Checkout kokkos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kokkos/kokkos
          path: kokkos

      - name: Build and install kokkos
        working-directory: kokkos
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B builddir
            -D Kokkos_ENABLE_${{matrix.kokkos_backend}}=ON
            -D Kokkos_ENABLE_COMPILER_WARNINGS=ON
            -D CMAKE_CXX_STANDARD=${{ matrix.stdcxx}}
            -D CMAKE_CXX_COMPILER=${{ matrix.CXX}}
          )

          cmake "${cmake_args[@]}"

          cmake --build builddir --parallel
          cmake --install builddir --prefix=$HOME/kokkos

      - name: Checkout patterns
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure patterns
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B builddir
            -D CMAKE_PREFIX_PATH="$HOME/kokkos"
            -D CMAKE_CXX_FLAGS="-Wall -Werror ${{matrix.sanitizer_flags}}"
            -D CMAKE_CXX_STANDARD=${{ matrix.stdcxx}}
            -D CMAKE_CXX_COMPILER=${{ matrix.CXX}}
            -D CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type}}
            -D CMAKE_CXX_CLANG_TIDY="${{ matrix.clang_tidy_args}}"
            -D CMAKE_EXE_LINKER_FLAGS="${{ matrix.sanitizer_flags}}"
          )

          cmake "${cmake_args[@]}"

      - name: Build patterns
        run: cmake --build builddir --parallel

      - name: Test patterns
        run: ctest --test-dir builddir --output-on-failure
