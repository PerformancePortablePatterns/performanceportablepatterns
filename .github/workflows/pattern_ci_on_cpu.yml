name: Patterns CI on CPU

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Code_CI:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        distro: ["ubuntu:latest"]
        cxx: [g++, clang++]
        cmake_build_type: [Release]
        kokkos_backend: [SERIAL, OPENMP]
        stdcxx: [20]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/kokkos/ci-containers/${{ matrix.distro }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure code
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B builddir
            -D Kokkos_ENABLE_${{matrix.kokkos_backend}}=ON
            -D Kokkos_ENABLE_COMPILER_WARNINGS=ON
            -D CMAKE_CXX_FLAGS=-Werror
            -D CMAKE_CXX_STANDARD=${{ matrix.stdcxx}}
            -D CMAKE_CXX_COMPILER=${{ matrix.CXX}}
            -D CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type}}
          )

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build builddir --parallel

      - name: Tests
        run: ctest --test-dir builddir --output-on-failure
