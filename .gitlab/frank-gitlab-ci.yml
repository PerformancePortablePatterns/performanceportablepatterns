workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Do not auto-cancel pipelines on main
    - if: $CI_COMMIT_BRANCH == "main"
      auto_cancel:
        on_new_commit: none
    # Do not trigger on push directly
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never

    - when: always

.common-setup:
  stage: test
  variables:
    OMP_NUM_THREADS: "8"
    OMP_PLACES: "cores"
    OMP_PROC_BIND: "close"

NVIDIA-GH200:
  extends: .common-setup
  tags: [nvidia-gh200]
  image: nvcr.io/nvidia/cuda:13.3.0-devel-ubuntu26.04
  script:
    - echo "Install dependencies"
    -  apt-get update && apt-get install -y cmake git python3

    - echo "Build and install kokkos"
    - git clone https://github.com/kokkos/kokkos.git
    - >
      cmake -S kokkos -B build_kokkos
      -DCMAKE_CXX_STANDARD=20
      -DKokkos_ARCH_HOPPER90=ON
      -DKokkos_ENABLE_OPENMP=ON
      -DKokkos_ENABLE_CUDA=ON
      -DKokkos_ENABLE_COMPILER_WARNINGS=ON
    - cmake --build build_kokkos --parallel
    - cmake --install build_kokkos --prefix=$HOME/kokkos

    - echo "Build and test patterns"
    - >
      cmake -S . -B build
      -DCMAKE_CXX_FLAGS="-Wall -Werror"
      -DCMAKE_PREFIX_PATH="$HOME/kokkos"
    - cmake --build build
    - ctest --test-dir build --output-on-failure

AMD-MI300A:
  extends: .common-setup
  tags: [uo-gpu, odyssey, amd-mi300]
  image: rocm/dev-ubuntu-26.04:7.14.0-full
  script:
    - echo "Install dependencies"
    - apt-get update && apt-get install -y cmake git

    - echo "Build and install kokkos"
    - git clone https://github.com/kokkos/kokkos.git
    - >
      cmake -S kokkos -B build_kokkos
      -DCMAKE_PREFIX_PATH=/opt/rocm-7.14.0
      -DCMAKE_CXX_COMPILER=hipcc
      -DCMAKE_CXX_STANDARD=20
      -DKokkos_ARCH_AMD_GFX942_APU=ON
      -DKokkos_ENABLE_HIP=ON
      -DKokkos_ARCH_ZEN4=ON
      -DKokkos_ENABLE_COMPILER_WARNINGS=ON
    - cmake --build build_kokkos --parallel
    - cmake --install build_kokkos --prefix=$HOME/kokkos

    - echo "Build and test patterns"
    - export HSA_XNACK=1
    - export KOKKOS_DEVICE_ID=2
    - export LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:$LD_LIBRARY_PATH
    - >
      cmake -S . -B build
      -DCMAKE_CXX_COMPILER=hipcc
      -DCMAKE_CXX_FLAGS="-Wall -Werror"
      -DCMAKE_PREFIX_PATH="$HOME/kokkos"
    - cmake --build build
    - ctest --test-dir build --output-on-failure

INTEL-DATA-CENTER-MAX-1100:
  extends: .common-setup
  tags: [intel-data-center-max-1100]
  image: intel/oneapi:2026.2.0-devel-ubuntu26.04
  script:
    - echo "Install dependencies"
    - apt-get update && apt-get install -y git intel-ocloc

    - echo "Build and install kokkos"
    - git clone https://github.com/kokkos/kokkos.git
    - sycl-ls
    - export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
    - export CMAKE_BUILD_PARALLEL_LEVEL=48
    - >
      cmake -S kokkos -B build_kokkos
      -DCMAKE_CXX_COMPILER=icpx
      -DCMAKE_CXX_STANDARD=20
      -DKokkos_ARCH_INTEL_PVC=ON
      -DKokkos_ENABLE_OPENMP=ON
      -DKokkos_ENABLE_SYCL=ON
      -DCMAKE_EXE_LINKER_FLAGS='-fsycl -flink-huge-device-code'
      -DCMAKE_CXX_FLAGS='-Wno-zero-length-array -Wno-pass-failed -Werror -fsycl-device-code-split=per_kernel -fp-model=precise'
    - cmake --build build_kokkos
    - cmake --install build_kokkos --prefix=$HOME/kokkos

    - echo "Build and test patterns"
    - sycl-ls
    - export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
    - export CLANG_TIDY_EXE=$(dirname $(which icpx))/compiler/clang-tidy
    - >
      cmake -S . -B build
      -DCMAKE_CXX_COMPILER=icpx
      -DCMAKE_CXX_FLAGS="-Wall -Werror"
      -DCMAKE_PREFIX_PATH="$HOME/kokkos"
      -DCMAKE_CXX_CLANG_TIDY='${CLANG_TIDY_EXE};-warnings-as-errors=*;--checks=-bugprone-reserved-identifier'
    - cmake --build build
    - ctest --test-dir build --output-on-failure
